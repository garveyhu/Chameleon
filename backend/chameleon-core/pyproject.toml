[project]
name = "chameleon-core"
version = "1.0.0"
description = "Chameleon 基础设施 + AI infra + 共享 ORM 模型"
requires-python = ">=3.12"
# core 是纯协议 / 共享基座层（依分层重构 core ← data ← integrations ← engine）。只声明
# src 实际 import 的依赖；asyncpg/alembic/cryptography/langchain-openai/redis/minio/docker/
# jieba/... 等是拆包前遗留的陈旧声明（实际使用方 data/integrations 已各自声明），移除以让
# core 及其消费者（agentkit 公共 SDK 等）保持精简，并修正分层。
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "fastapi>=0.115",             # core/api 响应封装 + 异常 handler 协议（实际 import 却漏声明）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chameleon"]
