[project]
name = "chameleon-core"
version = "1.0.0"
description = "Chameleon 纯协议 / 共享契约基座层（agentkit 等上层的精简依赖）"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# core 是纯协议 / 共享基座层（依分层重构 core ← data ← integrations ← engine）。只声明
# src 实际 import 的依赖；asyncpg/alembic/cryptography/langchain-openai/redis/minio/docker/
# jieba/... 等是拆包前遗留的陈旧声明（实际使用方 data/integrations 已各自声明），移除以让
# core 及其消费者（agentkit 公共 SDK 等）保持精简，并修正分层。
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "pyyaml>=6",
]

# fastapi 仅 core/api/response.py+sse.py（Web 响应封装/SSE）需要——非纯协议核心。移为可选
# extra：Web 层（api/app/system）各自声明 fastapi，导入 core.api.response/sse 时可用；而
# agentkit 公共 SDK / data / integrations / engine 都不 import 这两个模块，故 `pip install
# chameleon-agentkit`（→core，不带 [api]）不再被动拖入 fastapi/starlette，保持精简（评审9 🟠）。
[project.optional-dependencies]
api = ["fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chameleon"]
