[project]
name = "chameleon-agent-example-imagegen"
version = "0.1.0"
description = "示例：文生图助手 —— ctx.media 多模态生成"
requires-python = ">=3.12"
dependencies = ["chameleon-agentkit"]

[tool.uv.sources]
chameleon-agentkit = { workspace = true }

[project.entry-points."chameleon.agents"]
example-imagegen = "chameleon.agents.example_imagegen"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chameleon"]
