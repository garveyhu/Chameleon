[project]
name = "chameleon-agent-example-tool-use"
version = "0.1.0"
description = "示例：工具调用 —— 本地 @tool + 平台工具混用（ReAct 循环）"
requires-python = ">=3.12"
dependencies = ["chameleon-agentkit"]

[tool.uv.sources]
chameleon-agentkit = { workspace = true }

# 推荐的注册方式：声明 entry-point，命名空间内外都能被发现
[project.entry-points."chameleon.agents"]
example-tool-use = "chameleon.agents.example_tool_use"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chameleon"]
