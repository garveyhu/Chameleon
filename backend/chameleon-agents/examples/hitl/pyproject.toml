[project]
name = "chameleon-agent-example-hitl"
version = "0.1.0"
description = "示例：人在环 ctx.ask_human + 可恢复执行 durable"
requires-python = ">=3.12"
dependencies = ["chameleon-agentkit"]

[tool.uv.sources]
chameleon-agentkit = { workspace = true }

[project.entry-points."chameleon.agents"]
example-hitl = "chameleon.agents.example_hitl"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chameleon"]
