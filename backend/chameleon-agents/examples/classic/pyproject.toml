[project]
name = "chameleon-agent-example-classic"
version = "0.1.0"
description = "示例：BaseAgent 类式写法（共享同一 ctx）"
requires-python = ">=3.12"
dependencies = ["chameleon-agentkit"]

[tool.uv.sources]
chameleon-agentkit = { workspace = true }

[project.entry-points."chameleon.agents"]
example-classic = "chameleon.agents.example_classic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chameleon"]
