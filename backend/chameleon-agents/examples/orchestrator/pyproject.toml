[project]
name = "chameleon-agent-example-orchestrator"
version = "0.1.0"
description = "示例：编排 —— 把任务委托给子智能体（A2A）"
requires-python = ">=3.12"
dependencies = ["chameleon-agentkit"]

[tool.uv.sources]
chameleon-agentkit = { workspace = true }

[project.entry-points."chameleon.agents"]
example-orchestrator = "chameleon.agents.example_orchestrator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chameleon"]
