[project]
name = "chameleon-provider-comfyui"
version = "0.1.0"
description = "Chameleon comfyui provider —— 把本地 ComfyUI 文生图作为可对话 agent（会话内返回 Markdown 图片）"
requires-python = ">=3.12"
dependencies = [
    "chameleon-core",
    "chameleon-data",
    "chameleon-integrations",
    "chameleon-providers-base",
    "loguru>=0.7",
]

[tool.uv.sources]
chameleon-core = { workspace = true }
chameleon-data = { workspace = true }
chameleon-integrations = { workspace = true }
chameleon-providers-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chameleon"]
