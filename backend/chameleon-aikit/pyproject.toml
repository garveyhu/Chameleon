[project]
name = "chameleon-aikit"
version = "1.0.0"
description = "Chameleon 对内 AI 任务库（系统内部用 LLM 丰富功能的统一执行层 + 通用任务 + 注册表）"
requires-python = ">=3.12"
dependencies = [
    "chameleon-core",
    "chameleon-integrations",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "loguru>=0.7",
]

[tool.uv.sources]
chameleon-core = { workspace = true }
chameleon-integrations = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chameleon"]
