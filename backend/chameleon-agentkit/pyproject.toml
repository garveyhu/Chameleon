[project]
name = "chameleon-agentkit"
version = "0.1.0"
description = "Chameleon 本地智能体作者 SDK —— @agent / AgentRun / ModelSlot / Opt"
requires-python = ">=3.12"
dependencies = [
    "chameleon-core",
    "chameleon-providers-base",
]

# 本地自测 CLI（agentkit chat/run）额外依赖；站内运行时不需要
[project.optional-dependencies]
dev = ["httpx>=0.27"]
# 作者写离线单测（chameleon.agentkit.testing 的 FakeTransport / make_run / collect）
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
agentkit = "chameleon.agentkit._cli:main"

[tool.uv.sources]
chameleon-core = { workspace = true }
chameleon-providers-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chameleon"]
