[project]
name = "chameleon-agentkit"
version = "0.1.0"
description = "代码优先的智能体作者 SDK —— @agent + ctx，脱平台 pip install 即用"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["agent", "llm", "agentkit", "orchestration", "ai-agents", "mcp", "langchain", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # 只依赖精简 core（运行时协议类型已迁 chameleon.core.runtime_types）；不再依赖
    # providers-base（避免经 providers-base→data 拉入 sqlalchemy/asyncpg 等重依赖链），
    # 让公共 SDK + 沙箱子进程镜像保持精简。
    "chameleon-core",
    # MCP（Model Context Protocol）—— @agent 消费外部 MCP server 工具（authoring 关注点）
    "mcp>=1.27.2",
]

# 本地自测 CLI（agentkit chat/run）额外依赖；站内运行时不需要
[project.optional-dependencies]
dev = ["httpx>=0.27"]
# 作者写离线单测（chameleon.agentkit.testing 的 FakeTransport / make_run / collect）
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
agentkit = "chameleon.agentkit._cli:main"

[tool.uv.sources]
chameleon-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chameleon"]
